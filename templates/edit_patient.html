{% extends "base.html" %}

{% block content %}

<div class="container">

    <h2>Edit Patient Details</h2>

    <form method="POST">

        <label>Full Name</label>
        <input type="text" name="full_name" value="{{ patient.full_name }}" required>

        <label>Date of Birth</label>
        <input type="date" name="date_of_birth" value="{{ patient.date_of_birth or '' }}">

        <label>Gender</label>
        <select name="gender">
            <option value="Male" {% if patient.gender=='Male' %}selected{% endif %}>Male</option>
            <option value="Female" {% if patient.gender=='Female' %}selected{% endif %}>Female</option>
            <option value="Other" {% if patient.gender=='Other' %}selected{% endif %}>Other</option>
        </select>

        <label>Blood Group</label>
        <input type="text" name="blood_group" value="{{ patient.blood_group or '' }}">

        <label>Phone</label>
        <input type="text" name="phone" value="{{ patient.phone or '' }}">

        <label>Email</label>
        <input type="email" name="email" value="{{ patient.email or '' }}">

        <label>Address</label>
        <input type="text" name="address" value="{{ patient.address or '' }}">

        <label>Emergency Contact</label>
        <input type="text" name="emergency_contact" value="{{ patient.emergency_contact or '' }}">

        <label>Medical Conditions</label>
        <textarea name="medical_conditions">{{ patient.medical_conditions or '' }}</textarea>

        <button type="submit">Update Patient</button>

        <a href="{{ url_for('patients') }}">Cancel</a>

    </form>

</div>

{% endblock %}

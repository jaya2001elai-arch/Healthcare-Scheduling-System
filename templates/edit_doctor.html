{% extends "base.html" %}

{% block content %}

<div class="container">

    <h2>Edit Doctor Details</h2>

    <form method="POST">

        <label>Doctor Name</label>
        <input type="text" name="full_name" value="{{ doctor.full_name }}" required>

        <label>Specialization</label>
        <input type="text" name="specialization" value="{{ doctor.specialization or '' }}">

        <label>Qualification</label>
        <input type="text" name="qualification" value="{{ doctor.qualification or '' }}">

        <label>Experience</label>
        <input type="number" name="experience" value="{{ doctor.experience or '' }}">

        <label>Phone</label>
        <input type="text" name="phone" value="{{ doctor.phone or '' }}">

        <label>Email</label>
        <input type="email" name="email" value="{{ doctor.email or '' }}">

        <label>Consultation Fee</label>
        <input type="number" step="0.01" name="consultation_fee" value="{{ doctor.consultation_fee or '' }}">

        <label>Availability</label>
        <input type="text" name="availability" value="{{ doctor.availability or '' }}">

        <button type="submit">Update Doctor</button>

        <a href="{{ url_for('doctors') }}">Cancel</a>

    </form>

</div>

{% endblock %}
